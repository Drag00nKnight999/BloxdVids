<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Settings – BloxdVids</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2zm-2 16.5v-9l7 4.5-7 4.5z"/></svg>
    BloxdVids
  </a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h1>Account settings</h1>
    <p class="subtitle" id="settings-subtitle">Manage your account experience</p>
    <div class="form-error" id="error-msg"></div>
    <div class="form-success" id="success-msg"></div>
    <div id="settings-content">
      <div class="loader"><div class="spinner"></div></div>
    </div>
  </div>
</div>
<div id="toast-container"></div>
<script type="module">
import { api, toast, initNav } from '/app.js';
initNav();
const content = document.getElementById('settings-content');
const errorMsg = document.getElementById('error-msg');
const successMsg = document.getElementById('success-msg');
const me = await api.get('/api/auth/me');
if (!me.user) {
  window.location.href = '/login.html';
} else {
  const settings = await api.get('/api/auth/settings');
  content.innerHTML = `
    <form id="email-form">
      <div class="form-group">
        <label for="account-email" style="text-transform:none;letter-spacing:0">Account email</label>
        <p style="color:var(--text-muted);font-size:.875rem;margin-bottom:1rem">
          Add an email address for account recovery and security notices.
        </p>
        <input class="form-control" id="account-email" type="email" maxlength="320"
               autocomplete="email" placeholder="you@example.com" value="${escAttr(settings.email)}" required/>
      </div>
      <button class="btn btn-primary" type="submit">Save email</button>
    </form>
    ${me.user.role === 'owner' ? `
    <div class="form-group">
      <hr style="border:0;border-top:1px solid var(--border);margin:1.5rem 0"/>
      <label style="text-transform:none;letter-spacing:0">Owner preview mode</label>
      <p style="color:var(--text-muted);font-size:.875rem;margin-bottom:1rem">
        When enabled, you see BloxdVids like a regular user. Disable it to access owner moderation controls.
      </p>
      <label style="display:flex;align-items:center;gap:.75rem;cursor:pointer;color:var(--text)">
        <input type="checkbox" id="preview-mode" style="width:18px;height:18px;accent-color:var(--accent)"/>
        <span>Preview mode</span>
      </label>
    </div>
    <button class="btn btn-primary" id="save-settings" type="button">Save settings</button>` : ''}
  `;
  document.getElementById('email-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    try {
      await api.patch('/api/auth/settings/email', { email: document.getElementById('account-email').value });
      successMsg.textContent = 'Email address saved.';
      successMsg.classList.add('show');
      errorMsg.classList.remove('show');
      document.getElementById('legacy-email-warning')?.remove();
    } catch (err) {
      errorMsg.textContent = err.message || 'Could not save settings';
      errorMsg.classList.add('show');
    }
  });
  if (me.user.role === 'owner') {
    const checkbox = document.getElementById('preview-mode');
    checkbox.checked = me.user.previewMode;
    document.getElementById('save-settings').addEventListener('click', async () => {
      try {
        const result = await api.patch('/api/auth/settings/preview-mode', { previewMode: checkbox.checked });
        successMsg.textContent = result.user.previewMode
          ? 'Preview mode is on.'
          : 'Owner admin mode is on.';
        successMsg.classList.add('show');
        errorMsg.classList.remove('show');
        setTimeout(() => window.location.href = result.user.adminMode ? '/admin.html' : '/', 600);
      } catch (err) {
        errorMsg.textContent = err.message || 'Could not save settings';
        errorMsg.classList.add('show');
      }
    });
  }
}
function escAttr(value) {
  return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
