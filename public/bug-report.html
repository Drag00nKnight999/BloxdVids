<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Report a bug – BloxdVids</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<nav class="navbar"><a href="/" class="nav-logo"><svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2 2 7.373 2 14z"/></svg>BloxdVids</a><div class="nav-actions" id="nav-actions"></div></nav>
<main class="auth-page"><div class="auth-card"><h1>Report a bug</h1><p class="subtitle">Help the BloxdVids team improve the current version.</p>
  <div class="form-error" id="error"></div><div class="form-success" id="success"></div>
  <form id="bug-form">
    <div class="form-group"><label for="title">Short summary</label><input class="form-control" id="title" maxlength="200" required/></div>
    <div class="form-group"><label for="description">What happened?</label><textarea class="form-control" id="description" maxlength="5000" required style="min-height:120px"></textarea></div>
    <div class="form-group"><label for="steps">Steps to reproduce</label><textarea class="form-control" id="steps" maxlength="5000" style="min-height:100px"></textarea></div>
    <div class="form-group"><label for="severity">Severity</label><select class="form-control" id="severity"><option>low</option><option selected>normal</option><option>high</option><option>critical</option></select></div>
    <button class="btn btn-primary" style="width:100%">Submit bug report</button>
  </form>
</div></main>
<div id="toast-container"></div>
<script type="module">
import { api, initNav } from '/app.js';
initNav();
const me = await api.get('/api/auth/me');
if (!me.user) location.href = '/login.html';
document.getElementById('bug-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  try {
    await api.post('/api/platform/bugs', {
      title: document.getElementById('title').value,
      description: document.getElementById('description').value,
      stepsToReproduce: document.getElementById('steps').value,
      severity: document.getElementById('severity').value,
    });
    document.getElementById('success').textContent = 'Bug report submitted.';
    document.getElementById('success').classList.add('show');
    event.target.reset();
  } catch (err) {
    document.getElementById('error').textContent = err.message;
    document.getElementById('error').classList.add('show');
  }
});
</script>
</body>
</html>
