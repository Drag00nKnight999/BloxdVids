<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account – BloxdVids</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2zm-2 16.5v-9l7 4.5-7 4.5z"/></svg>
    BloxdVids
  </a>
  <div class="nav-actions">
    <a href="/login.html" class="btn btn-ghost btn-sm">Sign in</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="subtitle">Join BloxdVids to start uploading videos</p>

    <div class="form-error" id="error-msg"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input class="form-control" id="username" type="text" placeholder="your_username"
               autocomplete="username" required minlength="3" maxlength="30"
               pattern="[a-zA-Z0-9_]+" title="Letters, numbers, and underscores only"/>
        <small style="color:var(--text-dim);font-size:.78rem;margin-top:.3rem;display:block">3–30 characters, letters/numbers/underscores</small>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input class="form-control" id="email" type="email" placeholder="you@example.com" autocomplete="email" required/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" id="password" type="password" placeholder="••••••••"
               autocomplete="new-password" required minlength="8"/>
        <small style="color:var(--text-dim);font-size:.78rem;margin-top:.3rem;display:block">Minimum 8 characters</small>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="submit-btn">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module">
import { api, toast } from '/app.js';

const form = document.getElementById('register-form');
const errorMsg = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');

api.get('/api/auth/me').then(data => {
  if (data.user) window.location.href = '/';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Creating account…';

  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    await api.post('/api/auth/register', { username, email, password });
    toast('Account created!', 'success');
    setTimeout(() => window.location.href = '/', 600);
  } catch (err) {
    errorMsg.textContent = err.message || 'Registration failed';
    errorMsg.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
