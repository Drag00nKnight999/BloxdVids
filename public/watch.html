<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watch – BloxdVids</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2zm-2 16.5v-9l7 4.5-7 4.5z"/></svg>
    BloxdVids
  </a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<div class="container">
  <div class="watch-layout" id="watch-layout">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h2>Delete video?</h2>
    <p>This will permanently delete your video and cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancel-delete">Cancel</button>
      <button class="btn btn-danger" id="confirm-delete">Delete</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script type="module">
import { api, toast, initNav, formatDate, formatViews } from '/app.js';

initNav();

const params = new URLSearchParams(location.search);
const videoId = parseInt(params.get('id'), 10);
const layout = document.getElementById('watch-layout');

if (!videoId) {
  layout.innerHTML = '<p style="color:var(--text-muted);padding:2rem">Invalid video ID.</p>';
} else {
  const [videoData, relatedData, meData] = await Promise.all([
    api.get(`/api/videos/${videoId}`),
    api.get('/api/videos?limit=10'),
    api.get('/api/auth/me'),
  ]);

  document.title = `${videoData.title} – BloxdVids`;

  const canManage = meData.user && (
    meData.user.id === videoData.user_id ||
    meData.user.canModerate
  );
  const related = (relatedData.videos || []).filter(v => v.id !== videoId).slice(0, 8);

  layout.innerHTML = `
    <div>
      <div class="video-player-wrap">
        <video id="player" controls preload="metadata" playsinline>
          <source src="/api/videos/${videoId}/stream" type="${videoData.mime_type}"/>
          Your browser does not support video playback.
        </video>
      </div>
      <div class="video-details">
        <h1>${escHtml(videoData.title)}</h1>
        <div class="meta-row">
          <span class="meta-info">
            By <strong>${escHtml(videoData.uploader)}</strong>
            · ${formatViews(videoData.view_count)} views
             · <span id="like-count">${formatViews(videoData.like_count)} likes</span>
            · ${formatDate(videoData.created_at)}
          </span>
           ${meData.user ? `<button class="btn ${videoData.liked ? 'btn-primary' : 'btn-ghost'} btn-sm" id="like-btn">${videoData.liked ? 'Liked' : 'Like'}</button>` : ''}
        ${canManage ? `<button class="btn btn-danger btn-sm" id="delete-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            Delete
          </button>` : ''}
          ${meData.user && meData.user.id !== videoData.user_id ? '<button class="btn btn-ghost btn-sm" id="report-btn">Report</button>' : ''}
        </div>
        ${videoData.description ? `<p class="video-description">${escHtml(videoData.description)}</p>` : ''}
         <p class="video-category-label">Category: <strong>${escHtml(videoData.category || 'Other')}</strong></p>
      </div>
       <section class="comments-section">
         <div class="section-header"><h2 class="section-title">Comments</h2><span id="comment-count" class="text-muted"></span></div>
         ${meData.user ? `<form id="comment-form" class="comment-form">
           <textarea class="form-control" id="comment-input" maxlength="2000" rows="3" placeholder="Share your thoughts…" required></textarea>
           <button class="btn btn-primary btn-sm" type="submit">Post comment</button>
         </form>` : '<p class="text-muted">Sign in to join the conversation.</p>'}
         <div id="comments-list"><div class="loader"><div class="spinner"></div></div></div>
       </section>
    </div>
    <aside class="related-panel">
      <h2>More videos</h2>
      ${related.length ? related.map(v => `
        <div class="related-card" onclick="location.href='/watch.html?id=${v.id}'">
          <img class="related-thumb" src="/api/videos/${v.id}/thumbnail" alt="${escHtml(v.title)}" loading="lazy"/>
          <div class="related-info">
            <p class="related-title">${escHtml(v.title)}</p>
            <p class="related-meta">${escHtml(v.uploader)} · ${formatViews(v.view_count)} views</p>
          </div>
        </div>`).join('') : '<p style="color:var(--text-muted);font-size:.875rem">No other videos yet.</p>'}
    </aside>
  `;

  if (canManage) {
    const deleteBtn = document.getElementById('delete-btn');
    const modal = document.getElementById('delete-modal');
    const cancelBtn = document.getElementById('cancel-delete');
    const confirmBtn = document.getElementById('confirm-delete');

    deleteBtn.addEventListener('click', () => modal.classList.add('show'));
    cancelBtn.addEventListener('click', () => modal.classList.remove('show'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

    confirmBtn.addEventListener('click', async () => {
      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Deleting…';
      try {
        await api.delete(`/api/videos/${videoId}`);
        toast('Video deleted', 'success');
        setTimeout(() => window.location.href = '/', 800);
      } catch (err) {
        toast(err.message || 'Delete failed', 'error');
        modal.classList.remove('show');
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Delete';
      }
    });
  }
  document.getElementById('like-btn')?.addEventListener('click', async (event) => {
    event.target.disabled = true;
    try {
      const result = videoData.liked
        ? await api.delete(`/api/videos/${videoId}/like`)
        : await api.post(`/api/videos/${videoId}/like`, {});
      videoData.liked = result.liked;
      event.target.textContent = result.liked ? 'Liked' : 'Like';
      event.target.className = `btn ${result.liked ? 'btn-primary' : 'btn-ghost'} btn-sm`;
      document.getElementById('like-count').textContent = `${formatViews(result.likeCount)} likes`;
    } catch (err) {
      toast(err.message || 'Could not update like', 'error');
    } finally {
      event.target.disabled = false;
    }
  });
  async function loadComments() {
    const commentsEl = document.getElementById('comments-list');
    try {
      const data = await api.get(`/api/videos/${videoId}/comments`);
      document.getElementById('comment-count').textContent = `${data.comments.length} comments`;
      commentsEl.innerHTML = data.comments.length ? data.comments.map(comment => `
        <article class="comment">
          <div class="comment-header"><strong>${escHtml(comment.username)}</strong><span>${formatDate(comment.created_at)}</span></div>
          <p>${escHtml(comment.content)}</p>
          ${(meData.user && (meData.user.id === comment.user_id || meData.user.canModerate)) ? `<button class="comment-delete" data-comment-id="${comment.id}">Delete</button>` : ''}
        </article>`).join('') : '<p class="text-muted">No comments yet.</p>';
      commentsEl.querySelectorAll('[data-comment-id]').forEach(button => button.addEventListener('click', async () => {
        try {
          await api.delete(`/api/videos/${videoId}/comments/${button.dataset.commentId}`);
          await loadComments();
        } catch (err) { toast(err.message || 'Could not delete comment', 'error'); }
      }));
    } catch (err) {
      commentsEl.innerHTML = `<p class="text-muted">${escHtml(err.message)}</p>`;
    }
  }
  document.getElementById('comment-form')?.addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = document.getElementById('comment-input');
    try {
      await api.post(`/api/videos/${videoId}/comments`, { content: input.value });
      input.value = '';
      await loadComments();
    } catch (err) { toast(err.message || 'Could not post comment', 'error'); }
  });
  loadComments();
  document.getElementById('report-btn')?.addEventListener('click', async () => {
    const details = prompt('What is wrong with this video?');
    if (!details) return;
    try {
      await api.post('/api/platform/reports', {
        videoId,
        category: 'community_guidelines',
        details,
      });
      toast('Report submitted', 'success');
    } catch (err) {
      toast(err.message || 'Could not submit report', 'error');
    }
  });
}

function escHtml(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
