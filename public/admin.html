<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moderation – BloxdVids</title>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">
    <svg viewBox="0 0 28 28" fill="currentColor"><path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2zm-2 16.5v-9l7 4.5-7 4.5z"/></svg>
    BloxdVids
  </a>
  <div class="nav-actions" id="nav-actions"></div>
</nav>
<div class="container page">
  <div class="section-header">
    <div>
      <h2 class="section-title">Moderation center</h2>
      <p style="color:var(--text-muted);font-size:.875rem;margin-top:.25rem">Review content, copyright submissions, reports, appeals, and account restrictions.</p>
    </div>
    <a href="/settings.html" class="btn btn-ghost btn-sm">Account settings</a>
  </div>
  <div id="admin-list"><div class="loader"><div class="spinner"></div></div></div>
</div>
<div id="toast-container"></div>
<script type="module">
import { api, toast, initNav, formatDate, formatViews, formatBytes } from '/app.js';
initNav();
const list = document.getElementById('admin-list');
const me = await api.get('/api/auth/me');
if (!me.user || !me.user.canModerate) {
  window.location.href = me.user?.role === 'owner' ? '/settings.html' : '/login.html';
} else {
  const data = await api.get('/api/videos/manage');
  if (!data.videos.length) {
    list.innerHTML = '<div class="empty-state"><h3>No videos to moderate</h3><p>Uploaded videos will appear here.</p></div>';
  } else {
    list.innerHTML = data.videos.map(v => `
      <div class="my-uploads-card">
        <img class="my-uploads-thumb" src="/api/videos/${v.id}/thumbnail" alt="${esc(v.title)}"/>
        <div class="my-uploads-info">
          <p class="my-uploads-title">${esc(v.title)}</p>
          <p class="my-uploads-meta">By ${esc(v.uploader)} · ${formatViews(v.view_count)} views · ${formatBytes(v.file_size)} · ${formatDate(v.created_at)}</p>
          <div class="my-uploads-actions">
            <a href="/watch.html?id=${v.id}" class="btn btn-ghost btn-sm">Watch</a>
            <button class="btn btn-danger btn-sm" data-delete="${v.id}">Delete</button>
          </div>
        </div>
      </div>`).join('');
    list.querySelectorAll('[data-delete]').forEach(button => {
      button.addEventListener('click', async () => {
        if (!confirm('Delete this video permanently?')) return;
        button.disabled = true;
        try {
          await api.delete(`/api/videos/${button.dataset.delete}`);
          button.closest('.my-uploads-card').remove();
          toast('Video deleted', 'success');
        } catch (err) {
          button.disabled = false;
          toast(err.message || 'Delete failed', 'error');
        }
      });
    });
  }
  const reports = await api.get('/api/platform/reports');
  const appeals = await api.get('/api/platform/appeals');
  const copyrightCases = await api.get('/api/platform/copyright-cases');
  const sections = document.createElement('div');
  sections.innerHTML = `
    <section style="margin-top:2rem">
      <div class="section-header"><h2 class="section-title">Copyright submissions (${copyrightCases.cases.length})</h2></div>
      <div id="copyright-cases-list">${copyrightCases.cases.length ? copyrightCases.cases.map(copyrightCaseRow).join('') : '<p style="color:var(--text-muted)">No copyright submissions.</p>'}</div>
    </section>
    <section style="margin-top:2rem">
      <div class="section-header"><h2 class="section-title">Reports (${reports.reports.length})</h2></div>
      <div id="reports-list">${reports.reports.length ? reports.reports.map(reportRow).join('') : '<p style="color:var(--text-muted)">No reports.</p>'}</div>
    </section>
    <section style="margin-top:2rem">
      <div class="section-header"><h2 class="section-title">Appeals (${appeals.appeals.length})</h2></div>
      <div id="appeals-list">${appeals.appeals.length ? appeals.appeals.map(appealRow).join('') : '<p style="color:var(--text-muted)">No appeals.</p>'}</div>
    </section>
  `;
  document.querySelector('.container.page').appendChild(sections);
  sections.querySelectorAll('[data-report-status]').forEach(button => button.addEventListener('click', async () => {
    await api.patch(`/api/platform/reports/${button.dataset.reportStatus}`, { status: button.dataset.nextStatus, resolutionNote: '' });
    button.closest('.my-uploads-card').remove();
    toast('Report updated', 'success');
  }));
  sections.querySelectorAll('[data-appeal-status]').forEach(button => button.addEventListener('click', async () => {
    await api.patch(`/api/platform/appeals/${button.dataset.appealStatus}`, { status: button.dataset.nextStatus, decisionNote: '' });
    button.closest('.my-uploads-card').remove();
    toast('Appeal updated', 'success');
  }));
  sections.querySelectorAll('[data-copyright-save]').forEach(button => button.addEventListener('click', async () => {
    const card = button.closest('.copyright-case-card');
    button.disabled = true;
    try {
      await api.patch(`/api/platform/copyright-cases/${button.dataset.copyrightSave}`, {
        status: card.querySelector('[data-case-status]').value,
        resolutionNote: card.querySelector('[data-case-note]').value,
      });
      toast('Copyright submission updated', 'success');
    } catch (err) {
      toast(err.message || 'Could not update submission', 'error');
    } finally {
      button.disabled = false;
    }
  }));
  if (me.user.canManagePlatform) await renderUsers(document.querySelector('.container.page'));
}
function esc(value) {
  return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function reportRow(report) {
  return `<div class="my-uploads-card">
    <div class="my-uploads-info"><p class="my-uploads-title">${esc(report.category)}${report.video_title ? ` · ${esc(report.video_title)}` : ''}</p>
    <p class="my-uploads-meta">Reported by ${esc(report.reporter)}${report.reported_user ? ` · ${esc(report.reported_user)}` : ''} · ${esc(report.status)}</p>
    <p style="margin:.5rem 0">${esc(report.details)}</p>
    ${report.status === 'open' ? `<button class="btn btn-ghost btn-sm" data-report-status="${report.id}" data-next-status="resolved">Resolve</button>
    <button class="btn btn-ghost btn-sm" data-report-status="${report.id}" data-next-status="dismissed">Dismiss</button>` : ''}</div></div>`;
}
function appealRow(appeal) {
  return `<div class="my-uploads-card"><div class="my-uploads-info">
    <p class="my-uploads-title">${esc(appeal.username)} · ${esc(appeal.role)}</p>
    <p class="my-uploads-meta">${esc(appeal.status)} · ${formatDate(appeal.created_at)}</p>
    <p style="margin:.5rem 0">${esc(appeal.reason)}</p>
    ${appeal.status === 'open' ? `<button class="btn btn-primary btn-sm" data-appeal-status="${appeal.id}" data-next-status="resolved">Approve appeal</button>
    <button class="btn btn-ghost btn-sm" data-appeal-status="${appeal.id}" data-next-status="dismissed">Dismiss</button>` : ''}</div></div>`;
}
function copyrightCaseRow(item) {
  const title = item.submission_type === 'counter_notice' ? 'Counter-notice' : 'Copyright notice';
  const check = (label, value) => `<p><strong>${esc(label)}:</strong> ${value ? 'Confirmed' : 'Not confirmed'}</p>`;
  return `<article class="my-uploads-card copyright-case-card" style="align-items:flex-start">
    <div class="my-uploads-info">
      <p class="my-uploads-title">${title} · ${esc(item.public_ref)}</p>
      <p class="my-uploads-meta">${esc(item.status)} · Submitted ${formatDate(item.created_at)}${item.original_notice_ref ? ` · Linked notice ${esc(item.original_notice_ref)}` : ''}</p>
      ${item.prior_notice_details ? `<p><strong>Original notice reference/details:</strong><br/>${esc(item.prior_notice_details).replace(/\n/g, '<br/>')}</p>` : ''}
      <p><strong>Name:</strong> ${esc(item.claimant_name)} · <strong>Email:</strong> ${esc(item.email)}</p>
      <p><strong>Phone:</strong> ${esc(item.phone)}</p><p><strong>Mailing address:</strong><br/>${esc(item.mailing_address).replace(/\n/g, '<br/>')}</p>
      <p><strong>Electronic signature:</strong> ${esc(item.signature)}</p>
      ${item.submission_type === 'notice' ? `<p><strong>Copyrighted work:</strong><br/>${esc(item.copyrighted_work).replace(/\n/g, '<br/>')}</p>${check('Good-faith belief', item.good_faith)}${check('Accuracy and authority under penalty of perjury', item.accuracy_and_authority)}` : `${check('Counter-notice good-faith statement under penalty of perjury', item.counter_good_faith)}${check('Jurisdiction consent', item.jurisdiction_consent)}${check('Service-of-process consent', item.service_of_process_consent)}`}
      <p><strong>${item.submission_type === 'notice' ? 'Reported content locations' : 'Removed material and previous location'}:</strong><br/>${esc(item.content_location).replace(/\n/g, '<br/>')}</p>
      <div class="form-group" style="margin-top:1rem"><label>Status</label><select class="form-control" data-case-status style="max-width:240px">${['open','investigating','resolved','dismissed'].map(status => `<option value="${status}" ${status === item.status ? 'selected' : ''}>${status}</option>`).join('')}</select></div>
      <div class="form-group"><label>Internal review note</label><textarea class="form-control" data-case-note maxlength="3000">${esc(item.resolution_note || '')}</textarea></div>
      <button class="btn btn-primary btn-sm" data-copyright-save="${item.id}">Save review</button>
    </div>
  </article>`;
}
async function renderUsers(page) {
  const data = await api.get('/api/platform/users');
  const section = document.createElement('section');
  section.style.marginTop = '2rem';
  section.innerHTML = `<div class="section-header"><h2 class="section-title">Platform users</h2></div>
    <div id="users-list">${data.users.map(userRow).join('')}</div>`;
  page.appendChild(section);
  section.querySelectorAll('[data-role-user]').forEach(select => select.addEventListener('change', async () => {
    await api.patch(`/api/platform/users/${select.dataset.roleUser}/role`, { role: select.value });
    toast('Role updated', 'success');
  }));
  section.querySelectorAll('[data-user-action]').forEach(button => button.addEventListener('click', async () => {
    const reason = prompt('Reason for this action:');
    if (!reason) return;
    const action = button.dataset.userAction;
    await api.patch(`/api/platform/users/${button.dataset.userId}/status`, { action, reason, duration: 'permanent' });
    toast('Account status updated', 'success');
    window.location.reload();
  }));
}
function userRow(user) {
  const protectedUser = user.role === 'owner' || user.id === me.user.id;
  const roles = ['admin','moderator','developer','beta_tester','bug_hunter','contributor','booster','og_user','user'];
  return `<div class="my-uploads-card"><div class="my-uploads-info">
    <p class="my-uploads-title">${esc(user.username)} <span style="color:var(--text-muted)">(${esc(user.role)})</span></p>
    <p class="my-uploads-meta">${user.banned ? 'Banned' : user.restricted ? `Restricted: ${esc(user.restriction_type)}` : 'Active'}</p>
    ${protectedUser ? '<span style="color:var(--text-muted)">Protected account</span>' : `<select class="form-control" data-role-user="${user.id}" style="max-width:220px;display:inline-block">${roles.map(role => `<option value="${role}" ${role === user.role ? 'selected' : ''}>${role}</option>`).join('')}</select>
      <button class="btn btn-danger btn-sm" data-user-action="${user.banned ? 'unban' : 'ban'}" data-user-id="${user.id}">${user.banned ? 'Unban' : 'Ban'}</button>
      <button class="btn btn-ghost btn-sm" data-user-action="${user.restricted ? 'unrestrict' : 'restrict'}" data-user-id="${user.id}">${user.restricted ? 'Remove restriction' : 'Restrict uploads'}</button>`}
  </div></div>`;
}
</script>
</body>
</html>
